name: Sync major tag

on:
  push:
    branches: [main]
    paths: [MMDOC_VERSION]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move v1 to the tested update
        run: |
          git tag --force v1 "$GITHUB_SHA"
          git push --force origin refs/tags/v1
